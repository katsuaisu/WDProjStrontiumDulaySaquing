<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChiikArcade</title>
    <link rel="icon" type="image/favicon" href="../assets/favicon.png">
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="png" href="assets/usagiFavicon.png">
</head>

<body>

    <div id="userProfileHud" class="user-hud" style="display: none;">
        <div class="pfp-container">
            <img src="assets/chiPfp.png" id="currentUserPfp" alt="Profile" title="Click to switch character!">
        </div>
        <div class="user-info">
            <span id="displayEmail">User</span>
            <button id="logoutBtn" class="logout-link">Logout</button>
        </div>
    </div>

    <div class="login-backdrop" id="loginBackdrop">
        <div class="login-card">
            <div class="decoration-star" style="top: -20px; right: -20px;">★</div>
            <div class="decoration-star" style="bottom: 10px; left: -15px; font-size: 2rem;">★</div>

            <h2 id="loginTitle">Welcome !</h2>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="emailInput" class="cute-input" placeholder="enter email...">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="passwordInput" class="cute-input" placeholder="shhh...">
            </div>

            <div class="buttons-area">
                <button class="action-btn" id="doLoginBtn">Login</button>
                <button class="secondary-btn" id="toggleMode">Sign Up instead?</button>
                <button class="secondary-btn" id="forgotPasswordBtn">Forgot Password?</button>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <button class="anon-link" id="anonBtn">
                Just looking around? (Anonymous) &rarr;
            </button>
        </div>
    </div>



    <div class="game-container" id="gameContainer">
        <img src="assets/chiksomething.png" alt="Pixel art character" class="character-sprite" id="characterSprite">
        <img src="assets/Press_Start_2P.png" alt="Game UI Frame" class="ui-frame" aria-hidden="true">
    </div>

    <div class="overlay"></div>

    <h1 class="title">Chi<span class="clickHere">I</span>kArcade</h1>

    <nav class="menu-buttons" aria-label="Main menu">
        <ul>
            <li><a href="arcade/arcade.html">Arcade</a></li>
            <li><a href="shop/shop.html">Shop</a></li>
            <li><a href="about/about.html">About</a></li>
        </ul>
    </nav>

    <div class="particles" id="particles"></div>
    <div class="vignette"></div>

    <footer>
        <p>&copy; 2025-2026 Project by Mateo Uno F. Dulay and Rei Saquing</p>
        <p>All images used are not related to the official Chiikawa and Nintendo company.</p>
        <p>Psst...Want a new character? Click a letter from the title for a surprise ;3</p>
        <!--
        Sources: 
        Pinterest. (n.d.). Pinterest. https://www.pinterest.com/
        Nagano. (n.d.). Chiikawa (ちいかわ) [Character series]. Official website. https://chiikawa-info.jp/
        Sweety Rasty. (n.d.). SweetyRasty.otf [Font file]. Retrieved from URL
        -->
    </footer>
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <button id="musicToggle" class="music-toggle">PLAY MUSIC</button>
    <script type="module" src="indexFile.js"></script>
</body>

</html>
