<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiikabu's Pudding Chase</title>
    <link rel="stylesheet" href="snake.css">
</head>
<body>
    <div class="bg-overlay"></div>

    <div class="main-card">
        <div class="sidebar">
            <div class="logo-area">
                <h1>Chiikabu's<br>Pudding<br>Chase</h1>
            </div>

            <div class="stat-box">
                <span class="label">Score</span>
                <span id="score" class="value">0</span>
            </div>

            <div class="stat-box">
                <span class="label">Length</span>
                <span id="length" class="value">3</span>
            </div>

            <div class="instructions">
                <p><strong>Controls</strong></p>
                <div class="keys">
                    <span>↑</span><span>↓</span><span>←</span><span>→</span>
                </div>
                <p class="hint">Help Chiikabu eat all the Usagi puddings!</p>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>

            <div id="startScreen" class="overlay">
                <div class="modal">
                    <h2>Ready?</h2>
                    <p>Let's collect some Usagi puddings!</p>
                    <button id="startBtn">Play</button>
                </div>
            </div>

            <div id="gameOverScreen" class="overlay hidden">
                <div class="modal">
                    <h2>Game Over! Too much Usagi puddings...</h2>
                    <p>Final Score: <span id="finalScore">0</span></p>
                    <button id="restartBtn">Try Again?</button>
                </div>
            </div>
        </div>
    </div>

    <script src="snake.js"></script>
</body>
</html>
